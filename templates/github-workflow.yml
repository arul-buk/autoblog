# ═══════════════════════════════════════════════════════════════════════════════
# @stayboba/autoblog v2.1 — GitHub Actions Workflow Template
#
# Copy this file to .github/workflows/auto-blog.yml in your project.
# Customise the values marked with <!-- CHANGE --> comments.
#
# FEATURES:
#   - Three cron schedules: content generation, weekly audit, content freshness
#   - Random time jitter on scheduled runs (0-90min delay)
#   - Graceful handling of expected skips (jitter, duplicates, quality gate)
#   - Manual dispatch with command selection (generate/audit/refresh/research)
#   - YAML frontmatter validation before site build
#   - Commit with rebase to avoid merge conflicts
#   - Audit/refresh runs skip build and deploy
#
# SECRETS REQUIRED:
#   GEMINI_API_KEY          — Google Gemini API key (required)
#   DATAFORSEO_LOGIN        — DataForSEO login (if seo.enabled)
#   DATAFORSEO_PASSWORD     — DataForSEO password (if seo.enabled)
#   GSC_SERVICE_ACCOUNT_JSON — Google service account (if gsc.enabled)
#   GA4_SERVICE_ACCOUNT_JSON — Google service account (if analytics.enabled)
#   TELEGRAM_BOT_TOKEN      — Telegram bot token (if notifications configured)
#   TELEGRAM_CHAT_ID        — Telegram chat ID (if notifications configured)
#
# DEPLOY PLATFORM SECRETS (pick one):
#   VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
#   NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Auto Blog Pipeline

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of posts to generate'
        required: false
        type: number
        default: 1
      command:
        description: 'Pipeline command'
        required: false
        type: choice
        options:
          - generate
          - audit
          - refresh
          - research
        default: generate
      steps:
        description: 'Custom steps (comma-separated, overrides command)'
        required: false
        type: string

  schedule:
    # <!-- CHANGE --> Adjust cron schedules to your needs.
    - cron: '17 8 */3 * *'   # Content generation — every 3 days at 8:17 AM UTC
    - cron: '0 6 * * 1'      # Weekly audit + GEO tracking — Mondays 6 AM UTC
    - cron: '0 6 * * 3'      # Content freshness check — Wednesdays 6 AM UTC

# Prevent concurrent runs — each run modifies files and pushes commits.
concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ─── Time jitter (scheduled runs only) ────────────────────────────
      # Random 0-90 minute delay to avoid fixed-time bot signal.
      # Manual workflow_dispatch runs execute immediately.
      - name: Random time jitter
        if: github.event_name == 'schedule'
        run: |
          JITTER=$((RANDOM % 5400))
          echo "Sleeping ${JITTER}s (~$((JITTER / 60))min) for time jitter"
          sleep $JITTER

      # ─── Route cron to the right command ──────────────────────────────
      - name: Determine pipeline command
        id: pipeline
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "0 6 * * 1" ]; then
              echo "command=audit" >> $GITHUB_OUTPUT
              echo "is_audit=true" >> $GITHUB_OUTPUT
            elif [ "$CRON" = "0 6 * * 3" ]; then
              echo "command=refresh" >> $GITHUB_OUTPUT
              echo "is_audit=true" >> $GITHUB_OUTPUT
            else
              echo "command=" >> $GITHUB_OUTPUT
              echo "is_audit=false" >> $GITHUB_OUTPUT
            fi
          elif [ -n "${{ inputs.steps }}" ]; then
            echo "command=--steps ${{ inputs.steps }}" >> $GITHUB_OUTPUT
            echo "is_audit=false" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.command }}" != "generate" ]; then
            echo "command=${{ inputs.command }}" >> $GITHUB_OUTPUT
            echo "is_audit=${{ inputs.command == 'audit' || inputs.command == 'refresh' }}" >> $GITHUB_OUTPUT
          else
            echo "command=" >> $GITHUB_OUTPUT
            echo "is_audit=false" >> $GITHUB_OUTPUT
          fi

      # ─── Run the pipeline ──────────────────────────────────────────────
      - name: Run autoblog pipeline
        id: autoblog
        run: |
          BATCH_FLAG=""
          COMMAND="${{ steps.pipeline.outputs.command }}"
          if [ -z "$COMMAND" ]; then
            BATCH_FLAG="--batch ${{ github.event.inputs.batch_size || 1 }}"
          fi
          npx autoblog $COMMAND $BATCH_FLAG 2>&1 | tee /tmp/autoblog.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ─── Check if content was generated ────────────────────────────────
      - name: Check pipeline output
        id: check
        run: |
          if grep -q '✓' /tmp/autoblog.log; then
            echo "has_content=true" >> $GITHUB_OUTPUT
          else
            echo "has_content=false" >> $GITHUB_OUTPUT
          fi

      # ─── Validate YAML frontmatter ─────────────────────────────────────
      # Safety net before site build — catches any YAML issues the pipeline
      # auto-repair didn't fix.
      # <!-- CHANGE --> Update the glob path to match your posts directory.
      - name: Validate YAML frontmatter
        if: steps.check.outputs.has_content == 'true'
        run: |
          FAILED=0
          for file in src/content/blog/*.md; do
            node -e "
              const fs = require('fs');
              const content = fs.readFileSync('$file', 'utf8');
              const match = content.match(/^---\n([\s\S]*?)\n---/);
              if (!match) { console.error('No frontmatter: $file'); process.exit(1); }
              try { require('js-yaml').load(match[1]); }
              catch (e) { console.error('Invalid YAML in $file:', e.message); process.exit(1); }
            " || { echo "YAML validation failed: $file"; FAILED=1; }
          done
          [ "$FAILED" -eq 1 ] && exit 1
          echo "All frontmatter valid"

      # ─── Build site ────────────────────────────────────────────────────
      # <!-- CHANGE --> Replace with your build command.
      - name: Build site
        if: steps.check.outputs.has_content == 'true' && steps.pipeline.outputs.is_audit != 'true'
        run: npm run build

      # ─── Deploy ────────────────────────────────────────────────────────
      # <!-- CHANGE --> Replace with your deploy platform command.
      # Examples:
      #   Cloudflare: npx wrangler pages deploy dist --project-name mysite
      #   Vercel:     npx vercel deploy --prod --token $VERCEL_TOKEN
      #   Netlify:    npx netlify deploy --prod --auth $NETLIFY_AUTH_TOKEN
      - name: Deploy
        if: steps.check.outputs.has_content == 'true' && steps.pipeline.outputs.is_audit != 'true'
        run: echo "<!-- CHANGE --> Add your deploy command here"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ─── Commit and push ───────────────────────────────────────────────
      - name: Commit and push if changes exist
        if: steps.check.outputs.has_content == 'true'
        run: |
          # <!-- CHANGE --> Set to your bot user.
          git config user.name "Auto Blog Bot"
          git config user.email "bot@example.com"

          # <!-- CHANGE --> Update paths to match your project structure.
          git add src/content/blog/ public/images/blog/ .autoblog-context.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COMMIT_DATE=$(date +%Y-%m-%d)
          git commit -m "feat(blog): auto-publish ${COMMIT_DATE} blog post"

          # Rebase to avoid merge conflicts from concurrent pushes
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── Workflow summary ──────────────────────────────────────────────
      - name: Post workflow summary
        if: always()
        run: |
          echo "## Auto Blog Results" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Command:** ${{ steps.pipeline.outputs.command || 'generate' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/autoblog.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 /tmp/autoblog.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
